<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{dev_meta_description}}">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="tool-version" content="{{dev_tool_version}}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23343A3D'/%3E%3Cpath transform='translate(7.58 52.10) scale(0.04909 -0.04909)' fill='%23FFFFFF' d='M771 228 712 154H561V280C647 288 727 298 793 309C824 296 846 296 857 306L750 413C615 363 353 304 146 279L148 263C242 262 343 265 441 271V154H149L157 126H441V-12H64L73 -41H938C952 -41 963 -36 966 -25C923 14 850 69 850 69L787 -12H561V126H851C865 126 875 131 878 142C838 178 771 228 771 228ZM452 860 393 788H40L48 759H132V470L29 467L80 352C91 354 102 361 107 374C220 405 308 429 375 450V349H394C447 349 479 367 480 373V759H531C544 759 554 763 557 774V389H576C630 389 664 413 664 420V456H803V421H821C856 421 910 441 912 448V712C932 717 946 725 953 733L844 816L793 759H677L557 805V776C516 812 452 860 452 860ZM236 475V550H375V482ZM803 485H664V731H803ZM236 759H375V684H236ZM236 579V655H375V579Z'/%3E%3C/svg%3E">
<title>{{dev_title}}</title>
<style>
:root{--serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--graphite-900:#262A2C;--graphite-800:#343A3D;--graphite-600:#565B5E;--paper-0:#FFFEFC;--paper-50:#FBF8F2;--paper-100:#F1EEE8;--stone-300:#CCC6BD;--stone-500:#8A857D;--brass-700:#7A5A26;--brass-600:#9D7A43}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper-50);color:var(--graphite-900);font-family:var(--sans);font-size:16px;line-height:1.75}
main{max-width:640px;margin:0 auto;padding:56px 16px 40px}
.eyebrow{margin:0;color:var(--brass-700);font-size:14px;letter-spacing:.08em}
h1{font-family:var(--serif);font-size:clamp(28px,6vw,36px);line-height:1.35;margin:6px 0 14px}
.rule{width:56px;height:2px;background:var(--brass-600);border:0;margin:0 0 20px}
.lead{margin:0 0 8px;font-size:17px}
.purpose{margin:0 0 20px;padding-left:1.4em;font-size:17px}
.status{margin:0 0 28px;padding:14px 16px;background:var(--paper-0);border:1px solid var(--stone-300);border-left:4px solid var(--brass-600);border-radius:6px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border-radius:6px;font-size:16px;font-weight:700;line-height:1.3;text-decoration:none}
.btn-primary{background:var(--graphite-800);color:var(--paper-0);border:2px solid var(--graphite-800)}
.btn-ghost{background:var(--paper-0);color:var(--graphite-800);border:2px solid var(--stone-500)}
.btn:focus-visible{outline:3px solid var(--brass-600);outline-offset:2px}
footer{border-top:1px solid var(--stone-300);padding-top:16px;text-align:center;font-size:14px;color:var(--graphite-600)}
footer p{margin:0 0 8px}
footer a{color:var(--graphite-800)}
.sig{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
<p class="eyebrow">{{dev_eyebrow}}</p>
<h1>{{page_title}}</h1>
<hr class="rule">
<p class="lead">{{purpose_lead}}</p>
<ol class="purpose">
<li>{{purpose_item_1}}</li>
<li>{{purpose_item_2}}</li>
<li>{{purpose_item_3}}</li>
</ol>
<p class="status">{{dev_status}}</p>
<div class="actions">
<a class="btn btn-primary" href="{{booking_url}}" target="_blank" rel="noopener noreferrer" aria-label="{{booking_aria}}">{{booking}}</a>
<a class="btn btn-ghost" href="{{dev_all_tools_url}}">{{dev_all_tools}}</a>
</div>
<footer>
<p><a class="sig" href="{{signature_url}}" target="_blank" rel="noopener noreferrer">{{signature}}</a></p>
<p class="as-of">{{dev_version_line}}</p>
</footer>
</main>
</body>
</html>
