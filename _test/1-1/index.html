<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開公司決策工具｜聖彥學堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;family=Noto+Serif+TC:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
--navy-950:#061426;--navy-900:#0A2646;--navy-800:#123552;--navy-700:#1F4668;
--gold-600:#C9954D;--gold-500:#D2A663;--gold-300:#DFC39A;--gold-150:#EEE0CA;
--paper-50:#FCFAF7;--paper-100:#F7F3EE;--paper-200:#F0E9E1;--paper-300:#E5D9CC;
--ink-900:#10233C;--ink-800:#21344B;--ink-700:#455468;--ink-500:#6B7280;
--warn-700:#8A651E;--warn-100:#FBF1DD;
--serif:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU","MingLiU",serif;
--sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper-100);font-family:var(--sans);color:var(--ink-800);-webkit-font-smoothing:antialiased}
.screen{background:var(--paper-100);font-family:var(--sans);color:var(--ink-800);box-sizing:border-box;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.screen *{box-sizing:border-box}
.screen p{margin:0}
.screen button{font-family:var(--sans)}
.screen a{color:var(--navy-700)}
.screen :focus-visible{outline:3px solid var(--gold-500);outline-offset:3px;box-shadow:0 0 0 6px rgba(10,38,70,.35)}
/* 題幹／結果主標為切題時的程式化焦點落點，本身非互動元件，依設計稿不顯示焦點框 */
.qh:focus,.qh:focus-visible,.rh:focus,.rh:focus-visible{outline:none;box-shadow:none}
@media (prefers-reduced-motion:reduce){.screen *{transition:none!important}}
.em{font-weight:700;color:var(--navy-900);box-shadow:inset 0 -0.42em 0 var(--gold-150)}

/* side rail */
.side{background:var(--navy-900);color:var(--paper-100);padding:40px 22px 40px 26px;display:flex;flex-direction:column;gap:26px;position:relative}
.side::after{content:"";position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(var(--gold-500),rgba(210,166,99,.15))}
.side-brand{display:flex;flex-direction:column;gap:8px;padding-bottom:22px;border-bottom:1px solid rgba(223,195,154,.35)}
.side .tool{font-family:var(--serif);font-weight:700;font-size:25px;letter-spacing:.04em;color:#fff}
.side .sig{font-size:13px;color:var(--gold-300);letter-spacing:.04em}
.side-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--gold-300)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:7px 10px;border:1px solid transparent;border-radius:8px;background:none;color:inherit;font-size:15px;text-align:left;cursor:pointer}
.step .mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.28)}
.step .nm{flex:1}
.step > svg{opacity:.55}
.s-done{color:#E8EDF3}
.s-done .mk{border-color:var(--gold-500);color:var(--gold-500)}
.s-done:hover{background:rgba(255,255,255,.06)}
.s-cur{background:rgba(255,255,255,.08);border-color:rgba(210,166,99,.55);color:#fff;font-weight:700}
.s-cur .mk{background:var(--gold-500);border-color:var(--gold-500);color:var(--navy-950)}
.s-fut{color:rgba(232,237,243,.52);cursor:not-allowed}
.s-skip{color:rgba(232,237,243,.3);cursor:not-allowed}
.s-skip .mk{border-style:dashed;border-color:rgba(255,255,255,.18)}

.mtop{display:none;background:var(--navy-900);color:#fff;padding:14px 16px 0;border-bottom:2px solid var(--gold-500)}
.mtop .tool{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.04em}
.mtop-step{margin-top:4px;font-size:14px;color:var(--gold-300);font-weight:600}
.bar{margin-top:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold-500)}
.mflow summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;color:#E8EDF3;cursor:pointer}
.mflow summary::-webkit-details-marker{display:none}
.mflow summary span{flex:1}
.mflow summary .chev{flex:none;color:var(--gold-500);transition:transform .2s}
.mflow[open] summary .chev{transform:rotate(180deg)}
.mflow .steps{padding:4px 0 14px;border-top:1px solid rgba(223,195,154,.25);padding-top:8px}

.dmain{padding:56px 72px 40px}
.track{max-width:860px}
.track.wide{max-width:1040px}

/* question */
.badge{display:inline-flex;align-items:center;height:30px;padding:0 14px;border:1px solid var(--gold-500);border-radius:6px;font-size:14px;font-weight:600;color:var(--warn-700);background:var(--paper-50);letter-spacing:.04em}
.editing{display:flex;align-items:center;gap:8px;margin-bottom:14px!important;padding:10px 14px;border:1px solid var(--gold-300);border-radius:8px;background:var(--paper-50);color:var(--navy-800);font-size:15px;font-weight:600;width:max-content}
.editing svg{flex:none;color:var(--gold-600)}
.qh{font-family:var(--serif);font-weight:700;color:var(--navy-900);font-size:38px;line-height:1.42;letter-spacing:.01em;margin:18px 0 0;outline:none}
.qh::after{content:"";display:block;width:56px;height:2px;background:var(--gold-500);margin-top:22px}
.explain{margin-top:26px;display:flex;flex-direction:column;gap:16px}
.core{font-size:19px;line-height:1.8;color:var(--ink-900);font-weight:500}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.pts li{position:relative;padding-left:22px;font-size:17px;line-height:1.8;color:var(--ink-800)}
.pts li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:7px;background:var(--gold-500);transform:rotate(45deg)}
.pts li p + p{margin-top:10px}
.more{border:1px solid var(--gold-300);border-radius:10px;background:var(--paper-50)}
.more summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 18px;font-weight:700;font-size:16px;color:var(--navy-900);cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.more summary .chev{flex:none;color:var(--gold-600);transition:transform .2s}
.more[open] summary .chev{transform:rotate(180deg)}
.more .pts{padding:4px 18px 20px}

/* choices */
.choices{margin-top:34px;display:grid;gap:14px}
.ch-cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ch-binary{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ch-duo{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ch-list{grid-template-columns:minmax(0,1fr)}
.choice{position:relative;display:flex;align-items:flex-start;gap:14px;min-height:64px;padding:18px 20px;border:1.5px solid var(--gold-300);border-radius:10px;background:var(--paper-50);color:var(--navy-900);text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(16,35,60,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.choice:hover{border-color:var(--gold-500);box-shadow:0 4px 12px rgba(16,35,60,.08);transform:translateY(-1px)}
.choice .rd{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--ink-500);background:#fff}
.choice .txt{display:flex;flex-direction:column;gap:4px;flex:1}
.choice .main{font-size:18px;font-weight:700;line-height:1.5}
.choice .meta{font-size:14px;line-height:1.6;color:var(--ink-700)}
.ch-cols3 .choice{flex-direction:column;gap:14px;min-height:132px}
.ch-binary .choice{min-height:132px;padding:26px 28px;align-items:center;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.ch-binary .choice::after{content:"";position:absolute;top:0;right:0;width:31px;height:1.5px;background:var(--gold-300);transform-origin:right top;transform:translateX(-0.5px) rotate(45deg) scaleX(1)}
.ch-binary .choice .main{font-family:var(--serif);font-size:30px;letter-spacing:.08em}
.ch-duo .choice{min-height:96px;align-items:center}
.choice.is-sel{background:var(--navy-900);border-color:var(--navy-900);color:#fff;box-shadow:0 6px 18px rgba(10,38,70,.22)}
.choice.is-sel .rd{border-color:var(--gold-500);background:var(--gold-500);box-shadow:inset 0 0 0 4px var(--navy-900)}
.choice.is-sel .meta{color:var(--gold-150)}
.picked{position:absolute;top:14px;right:16px;font-size:13px;font-weight:700;color:var(--navy-950);background:var(--gold-500);border-radius:4px;padding:3px 9px;letter-spacing:.04em}
.ch-binary .choice.is-sel::after{background:var(--gold-500)}
.ch-binary .picked{right:30px}

/* official link */
.official{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:14px 18px;border:1.5px solid var(--navy-700);border-radius:8px;background:#fff;text-decoration:none;max-width:520px}
.official:hover{background:var(--paper-50);border-color:var(--navy-900)}
.o-txt{display:flex;flex-direction:column;gap:2px}
.o-t{font-weight:700;font-size:16px;color:var(--navy-900)}
.o-u{font-size:13px;color:var(--ink-700);word-break:break-all}
.official svg{flex:none;color:var(--navy-700)}

/* reference */
.ref{margin-top:44px;padding-top:30px;border-top:1px solid var(--paper-300);display:flex;flex-direction:column;gap:12px}
.ref-h{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-family:var(--serif);font-size:23px;color:var(--navy-900)}
.ref-h svg{flex:none;color:var(--gold-600)}
.rgrp{border:1px solid var(--gold-150);border-radius:10px;background:#fff}
.rgrp summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 18px;font-weight:700;font-size:16px;color:var(--navy-900);cursor:pointer}
.rgrp summary::-webkit-details-marker{display:none}
.rgrp summary .chev{flex:none;color:var(--gold-600);transition:transform .2s}
.rgrp[open] summary .chev{transform:rotate(180deg)}
.rlist{list-style:none;padding:4px 18px 18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;border-top:1px solid var(--paper-200);padding-top:14px;margin:0}
.rlist li{font-size:15px;line-height:1.6;color:var(--ink-800);padding-left:14px;position:relative}
.rlist li::before{content:"";position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--gold-500)}

/* nav + footer */
.nav{margin-top:48px;padding-top:24px;border-top:1px solid var(--gold-150);display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn-sec{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border:1.5px solid var(--navy-700);border-radius:8px;background:#fff;color:var(--navy-900);font-size:16px;font-weight:700;cursor:pointer}
.btn-sec:disabled{border-color:var(--paper-300);color:#9AA3AF;background:var(--paper-50);cursor:not-allowed}
.btn-txt{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:none;background:none;color:var(--ink-700);font-size:15px;font-weight:600;cursor:pointer;border-radius:8px}
.btn-txt:hover{color:var(--navy-900);background:var(--paper-200)}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--paper-300);display:flex;flex-direction:column;gap:6px}
.fsig{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--navy-900);letter-spacing:.04em}
.foot p{font-size:13px;color:var(--ink-700);line-height:1.7}

/* result */
.rpage{display:flex;flex-direction:column;gap:24px}
.rpage .nav{margin-top:12px}
.rpage .foot{margin-top:8px}
.hero{background:var(--navy-900);color:#fff;border-radius:14px;padding:40px 44px 42px;position:relative;box-shadow:0 10px 30px rgba(6,20,38,.18)}
.hero::before{content:"";position:absolute;inset:8px;border:1px solid rgba(210,166,99,.4);border-radius:9px;pointer-events:none}
.hero-tags{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag-sum{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--navy-950);background:var(--gold-500);border-radius:4px;padding:4px 10px}
.tag-lab{font-size:14px;font-weight:600;letter-spacing:.12em;color:var(--gold-300)}
.rh{font-family:var(--serif);font-size:40px;line-height:1.35;margin:18px 0 0;color:#fff;outline:none}
.rnote{margin-top:16px!important;font-size:18px;line-height:1.8;color:var(--paper-200);max-width:760px}
.callout{background:var(--paper-50);border:1px solid rgba(138,101,30,.45);border-radius:12px;padding:22px 26px 24px;display:flex;flex-direction:column;gap:12px}
.c-head{display:flex;align-items:center;gap:12px}
.c-ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--warn-100);color:var(--warn-700)}
.c-head h3{margin:0;font-size:19px;line-height:1.5;color:var(--ink-900)}
.c-body{padding-left:50px;display:flex;flex-direction:column;gap:14px}
.c-body p{font-size:17px;line-height:1.8}
.c-body .official{margin-top:4px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.panel{background:#fff;border:1px solid var(--gold-150);border-radius:12px;padding:26px 28px 28px}
.panel h2{margin:0 0 16px;font-family:var(--serif);font-size:22px;line-height:1.45;color:var(--navy-900)}
.p-check{background:var(--paper-50);border-color:var(--gold-300);border-top:3px solid var(--gold-500)}
.panel .pts li{font-size:16px}
.panel .c-body p{font-size:16px}
.gsec{display:flex;flex-direction:column;gap:18px}
.gsec > h2{margin:0;font-family:var(--serif);font-size:22px;line-height:1.45;color:var(--navy-900)}
.org{background:#fff;border:1px solid var(--gold-300);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(16,35,60,.05)}
.org-h{margin:0;background:var(--navy-900);color:#fff;font-family:var(--serif);font-size:21px;padding:18px 24px;border-bottom:2px solid var(--gold-500)}
.org dl{margin:0;padding:6px 24px 12px}
.org .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--paper-200)}
.org .row:last-child{border-bottom:none}
.org dt{font-size:14px;font-weight:700;color:var(--warn-700);letter-spacing:.06em;padding-top:2px}
.org dd{margin:0;font-size:16px;line-height:1.7;color:var(--ink-900)}
.nums{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:14px}
.nums li{counter-increment:n;position:relative;padding-left:44px;font-size:16px;line-height:1.8}
.nums li::before{content:counter(n);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold-500);color:var(--warn-700);font-family:var(--serif);font-weight:700;display:grid;place-items:center;font-size:15px}
.tail{background:var(--paper-50)}

/* mobile */
@media (max-width:1023px){
.screen{display:block;min-height:100vh}
.side{display:none}
.mtop{display:block}
.dmain{padding:24px 16px 28px}
.track,.track.wide{max-width:none}
.qh{font-size:27px;line-height:1.45;margin-top:14px}
.qh::after{margin-top:16px;width:44px}
.explain{margin-top:20px;gap:14px}
.core{font-size:17px}
.pts li{font-size:16px;line-height:1.75}
.choices{margin-top:26px;gap:12px}
.ch-cols3,.ch-binary,.ch-duo{grid-template-columns:minmax(0,1fr)}
.ch-cols3 .choice{flex-direction:row;min-height:64px}
.ch-binary .choice{min-height:76px;padding:18px 20px}
.ch-binary .choice .main{font-size:24px}
.ch-duo .choice{min-height:64px;align-items:flex-start}
.choice{padding:16px 16px}
.choice .main{font-size:17px}
.picked{position:static;align-self:center;flex:none}
.choice.is-sel{padding-right:14px}
.ref{margin-top:34px;padding-top:24px}
.ref-h{font-size:20px}
.rgrp summary{font-size:15px;padding:12px 16px;line-height:1.5}
.rlist{grid-template-columns:repeat(2,minmax(0,1fr))}
.official{max-width:none}
.nav{margin-top:36px}
.nav button{flex:1;justify-content:center}
.editing{width:auto;font-size:14px}
.rpage{gap:18px}
.hero{padding:28px 22px 30px}
.rh{font-size:28px}
.rnote{font-size:16px}
.pair{grid-template-columns:minmax(0,1fr);gap:18px}
.panel{padding:22px 18px 22px}
.panel h2{font-size:20px}
.gsec{gap:14px}
.gsec > h2{font-size:20px}
.callout{padding:18px 16px 20px}
.c-body{padding-left:0}
.c-head h3{font-size:17px}
.c-body p{font-size:16px}
.org-h{font-size:19px;padding:16px 18px}
.org dl{padding:4px 18px 10px}
.org .row{grid-template-columns:minmax(0,1fr);gap:4px}
}
</style>
</head>
<body>
<div class="screen">
  <aside class="side" id="side" aria-label="判斷流程">
    <div class="side-brand"><div class="tool">開公司決策工具</div><div class="sig">聖彥學堂｜林彥竹會計師</div></div>
    <div class="side-label"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v8"/><path d="M11 6h9M11 18h9M11 12h9"/></svg><span>判斷流程</span></div>
    <ol class="steps" id="dsteps"></ol>
  </aside>
  <header class="mtop" id="mtop">
    <div class="mtop-row"><div class="tool">開公司決策工具</div></div>
    <div class="mtop-step" id="mstep"></div>
    <div class="bar" id="mbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label=""><span style="width:0%"></span></div>
    <details class="mflow" id="mflow"><summary id="mflowsum" aria-expanded="false"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v8"/><path d="M11 6h9M11 18h9M11 12h9"/></svg><span>查看流程摘要</span><svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></summary>
      <ol class="steps" id="msteps"></ol>
    </details>
  </header>
  <main class="dmain"><div class="track" id="track"></div></main>
</div>
<script>
(function(){
'use strict';

/* ============ 一、文字資料（依《開公司決策工具_功能規格_去視覺版_v1_0》逐字） ============ */

var SIG = '聖彥學堂｜林彥竹會計師';
var FOOT_NOTE = '本工具內容僅供參考，實際認定以稅徵機關個案認定為準。';
var GCIS_T = '經濟部商業發展署｜特許業務查詢';
var GCIS_U = 'https://gcis.nat.gov.tw/cod/unit';

var STEPS = [
  ['q1','執行業務者'],
  ['q1a','專業性勞務範圍'],
  ['q2','固定營業場所'],
  ['q2c','銷售通路'],
  ['q3a','起徵點業別群'],
  ['q3','月銷售額'],
  ['q3b','事前許可（特許行業）'],
  ['q3c','組織限制'],
  ['q4','所得與稅負'],
  ['q5','銀行授信'],
  ['q5b','政府採購'],
  ['q6','合夥狀況'],
  ['q7','責任風險']
];
var LAST_STEP = '完成建議';

/* ============ 四、題序與分支（規格第四節） ============ */
var OPTS = {};
for(var k in Q){ if(Q.hasOwnProperty(k)) OPTS[k]=Q[k].choices.map(function(c){return c[0];}); }
OPTS.q3 = ['reached','below'];

function nextNode(id,v){
  switch(id){
    case 'q1':  return v==='unsure'?{t:1,variant:'unconfirmed'}:(v==='yes'?'q1a':'q2');
    case 'q1a': return v==='yes'?{t:1,variant:'excluded'}:(v==='unsure'?{t:1,variant:'unconfirmed'}:'q2');
    case 'q2':  return v==='yes'?'q3b':'q2c';
    case 'q2c': return v==='online'?'q3a':'q3b';
    case 'q3a': return v==='unsure'?'q3b':'q3';
    case 'q3':  return v==='below'?{t:2}:'q3b';
    case 'q3b': return 'q3c';
    case 'q3c': return 'q4';
    case 'q4':  return 'q5';
    case 'q5':  return 'q5b';
    case 'q5b': return 'q6';
    case 'q6':  return 'q7';
    case 'q7':  return {t:3};
  }
  return null;
}
/* 已答部分之實際路徑；遇未答題即停，最後一項為該未答題 */
function walk(a){
  var path=[], node='q1', guard=0;
  while(node && typeof node==='string' && guard++<40){
    path.push(node);
    var v=a[node];
    if(v===undefined) return {path:path, terminal:null};
    node=nextNode(node,v);
  }
  return {path:path, terminal:node};
}
/* 在目前作答下「仍有可能到達」的題目集合 */
function reachable(a){
  var seen={};
  (function rec(node){
    if(!node || typeof node!=='string') return;
    if(seen[node]) return;
    seen[node]=true;
    var v=a[node];
    var opts = (v!==undefined)?[v]:OPTS[node];
    for(var i=0;i<opts.length;i++) rec(nextNode(node,opts[i]));
  })('q1');
  return seen;
}
/* 所有可能完成路徑之題數集合 */
function pathLengths(a){
  var out={};
  (function rec(node,d){
    if(!node) return;
    if(typeof node!=='string'){ out[d]=true; return; }
    var v=a[node];
    var opts=(v!==undefined)?[v]:OPTS[node];
    for(var i=0;i<opts.length;i++) rec(nextNode(node,opts[i]), d+1);
  })('q1',0);
  var list=[]; for(var n in out) if(out.hasOwnProperty(n)) list.push(parseInt(n,10));
  return list;
}
/* 改答後清除不可達題目之答案（規格第四節末段） */
function prune(a){
  var R=reachable(a), removed=[];
  for(var i=0;i<STEPS.length;i++){
    var id=STEPS[i][0];
    if(a[id]!==undefined && !R[id]){ delete a[id]; removed.push(id); }
  }
  return removed;
}
function ordered(a){
  var R=reachable(a), out=[];
  for(var i=0;i<STEPS.length;i++) if(R[STEPS[i][0]]) out.push(STEPS[i][0]);
  return out;
}
function progress(a,cursor){
  var lens=pathLengths(a), max=0, exact=(lens.length===1);
  for(var i=0;i<lens.length;i++) if(lens[i]>max) max=lens[i];
  var ord=ordered(a);
  var idx = (cursor==='result') ? max : (ord.indexOf(cursor)+1);
  return {idx:idx, total:max, exact:exact,
          text:'第 '+idx+' 步，'+(exact?'共 ':'最多 ')+max+' 步',
          pct:(idx/max*100).toFixed(1)};
}

function isMixedScope(a){ return a.q1==='yes' && a.q1a==='no'; }
function qdef(id,a){
  var d=Q[id], mix=isMixedScope(a);
  var o={stem:d.stem, notes:d.notes.slice(0), choices:d.choices.slice(0), layout:d.layout,
         ref:!!d.ref, official:!!d.official, fold:!!d.fold};
  if(id==='q2' && mix){ o.stem=MIX_Q2_STEM; o.notes=[MIX_Q2_NOTE].concat(d.notes.slice(1)); }
  if(id==='q2c' && mix){ o.stem=MIX_Q2C_STEM; o.notes=[MIX_Q2C_NOTE].concat(d.notes); }
  if(id==='q3a' && mix){ o.stem=MIX_Q3A_STEM; o.notes=[MIX_Q3A_NOTE].concat(d.notes); }
  if(id==='q3'){
    var g=Q3_BY_GROUP[a.q3a];
    if(g){
      o.notes=g.notes.slice(0); o.choices=g.choices.slice(0);
      if(mix) o.notes=[(a.q3a==='mixed')?MIX_Q3_NOTE_MIXED:MIX_Q3_NOTE_SINGLE].concat(o.notes);
    }
  }
  if(id==='q7'){ var p=Q7_BY_Q6[a.q6]; if(p) o.notes=p.concat(d.notes.slice(1)); }
  return o;
}

    var parts=splitChoice(c[1]), on=(sel===c[0]);
    return '<button type="button" class="choice'+(on?' is-sel':'')+'" aria-pressed="'+(on?'true':'false')+'" data-v="'+esc(c[0])+'">'
      +'<span class="rd" aria-hidden="true"></span><span class="txt"><span class="main">'+esc(parts[0])+'</span>'
      +(parts[1]?'<span class="meta">'+esc(parts[1])+'</span>':'')+'</span>'
      +(on?'<span class="picked">✓ 已選</span>':'')+'</button>';
  }).join('')+'</div>';
}
function refHtml(){
  var open=isDesk();
  var groups=REF_GROUPS.map(function(g){
    return detailsHtml('rgrp',g[0],'<ul class="rlist">'+g[1].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>',open);
  }).join('');
  return '<section class="ref" aria-labelledby="ref-h"><h2 id="ref-h" class="ref-h">'+IC.doc+'<span>法規明列職類與概括條款</span></h2>'+groups+'</section>';
}

/* ============ 六、結果頁（規格第六節） ============ */
function heroHtml(label,head,note){
  return '<section class="hero"><div class="hero-tags"><span class="tag-sum">專業判斷摘要</span><span class="tag-lab">'+esc(label)+'</span></div>'
    +'<h1 class="rh" tabindex="-1">'+esc(head)+'</h1><p class="rnote">'+rt(note)+'</p></section>';
}
function tailHtml(){
  return detailsHtml('more tail','使用限制與課程補充',ptsUl(TAIL_PTS),false);
}
function outcome(a){
  var score=0;
  if(a.q4==='low') score-=2; else if(a.q4==='high') score+=1;
  if(a.q7==='care') score+=2; else if(a.q7==='ok') score-=2;
  var lean = score>0?'company':(score===0?'both':'firm');
  var veto=false;
  if(a.q7==='care' && lean!=='company'){ veto=true; lean='both'; }
  return {score:score, lean:lean, veto:veto};
}
function firmName(a){ return a.q6==='partner'?'合夥行號':'獨資行號'; }

function resultType1(a,variant){
  var v=T1[variant];
  var why=T1.why.concat([v.third]);
  return heroHtml(T1.label, v.head, v.note)
    +'<section class="panel p-reason"><h2>為什麼這樣判斷</h2>'+ptsUl(why)+'</section>'
    +tailHtml();
}
function resultType2(a){
  var mix=isMixedScope(a);
  var scope=mix?SCOPE.mix:SCOPE.plain, sales=mix?SCOPE.salesMix:SCOPE.salesPlain;
  var gt=GROUP_TEXT[a.q3a];
  var why=[scope+'沒有固定營業場所，且屬本工具目前已涵蓋的網路銷售情境。',
           '你已確認'+scope+'的法定起徵點業別群為'+gt+'，目前'+sales+'未達該組門檻。'];
  if(mix) why.push(T2.mixAdd);
  why.push(T2.last);
  var warns='';
  if(a.q3a==='mixed') warns+=calloutHtml(T2.mixedWarnH, ps([T2.mixedWarnB]));
  var b1=scope+'目前沒有固定營業場所且屬網路銷售，並已依法定業別群確認'+sales+'未達起徵點，因此本工具在這個已納入的官方規則範圍內顯示暫免。';
  if(mix) b1+=T2.scopeWarnMix;
  warns+=calloutHtml(T2.scopeWarnH, ps([b1,T2.scopeWarnB2]));
  return heroHtml(T2.label,T2.head,T2.note)
    +'<section class="panel p-reason"><h2>判斷理由</h2>'+ptsUl(why)+'</section>'
    +'<section class="gsec"><h2>'+esc(T3.stillWatch)+'</h2>'+warns+'</section>'
    +tailHtml();
}
function resultType3(a){
  var oc=outcome(a), fn=firmName(a), mix=isMixedScope(a);
  var scope=mix?SCOPE.mix:SCOPE.plain, sales=mix?SCOPE.salesMix:SCOPE.salesPlain;
  var head, note;
  if(a.q3c==='company'){ head=T3.headCompany; note=T3.noteCompany; }
  else if(a.q3c==='unsure'){ head=T3.headUnsure; note=T3.noteUnsure; }
  else if(oc.lean==='both'){ head=fn+'與公司皆可考慮'; note=oc.veto?T3.noteVeto:T3.noteBoth; }
  else { head='建議：設立'+(oc.lean==='company'?'公司':fn); note=T3.noteLean; }
  var h=heroHtml(T3.label,head,note);

  /* 1 事前許可警示 */
  if(a.q3b==='yes') h+=calloutHtml(T3.permitYesH, ps([T3.permitB,T3.permitYesAdd]));
  else if(a.q3b==='unsure') h+=calloutHtml(T3.permitUnsureH, ps([T3.permitB])+officialHtml());

  /* 2 組織限制警示 */
  if(a.q3c==='company') h+=calloutHtml(T3.orgLimitCompanyH, ps([T3.orgLimitCompanyB]));
  else if(a.q3c==='unsure') h+=calloutHtml(T3.orgLimitUnsureH, ps([T3.orgLimitUnsureB]));

  /* 3 稅籍登記段 + 4 判斷理由（並排） */
  var regNeed = (a.q2==='yes') || (a.q2==='no' && a.q2c==='online' && a.q3==='reached');
  var regPanel;
  if(regNeed){
    var pts=[];
    if(a.q2==='yes') pts.push(scope+T3.regPlace);
    else pts.push(scope+T3.regOnline+GROUP_TEXT[a.q3a]+'，且'+sales+'已達起徵點。');
    if(mix) pts.push(T3.regMixAdd);
    pts.push(T3.regLast);
    regPanel='<section class="panel p-check"><h2>'+esc(T3.regNeedH)+'</h2>'+ptsUl(pts)+'</section>';
  }else{
    regPanel='<section class="panel p-check"><h2>'+esc(T3.regUnknownH)+'</h2>'
      +'<div class="c-head"><span class="c-ic">'+IC.warn+'</span><h3>'+esc(T3.regUnknownWarnH)+'</h3></div>'
      +'<div class="c-body">'+ps([T3.regUnknownWarnB])+'</div></section>';
  }
  var reasons=[T3.reasonQ4[a.q4],T3.reasonQ5[a.q5],T3.reasonQ5b[a.q5b],T3.reasonQ6[a.q6],T3.reasonQ7[a.q7]];
  if(a.q3c==='unsure'){
    var pref = oc.lean==='both'?'兩者皆可':(oc.lean==='company'?'設立公司':'設立'+fn);
    reasons.push(T3.reasonQ3cUnsurePre+pref+'。');
  }
  if(a.q3c==='company') reasons.push(T3.reasonQ3cCompany);
  h+='<div class="pair">'+regPanel+'<section class="panel p-reason"><h2>判斷理由</h2>'+ptsUl(reasons)+'</section></div>';

  /* 5 組織說明卡 */
  var cards;
  if(a.q3c==='company') cards=['company'];
  else if(a.q3c==='unsure'||oc.lean==='both') cards=[(a.q6==='partner'?'partner':'solo'),'company'];
  else if(oc.lean==='company') cards=['company'];
  else cards=[(a.q6==='partner'?'partner':'solo')];
  h+='<div class="pair cards">'+cards.map(function(key){
    var c=T3.cards[key];
    return '<article class="org"><h3 class="org-h">設立'+esc(c.name)+'：完整說明</h3><dl>'
      +c.rows.map(function(r){return '<div class="row"><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>';}).join('')
      +'</dl></article>';
  }).join('')+'</div>';

  /* 6 選擇後要注意的事項 */
  h+='<section class="panel p-after"><h2>'+esc(T3.afterH)+'</h2>'
    +numsOl([T3.afterLiab[a.q6==='partner'?'partner':'solo'],T3.after2,T3.after3])+'</section>';

  /* 7 合夥警示 */
  if(a.q6==='partner'){
    var leanFirm = (a.q3c!=='company' && oc.lean==='firm');
    var body=[T3.partnerWarnB1];
    if(leanFirm) body.push(T3.partnerWarnB2);
    body.push(T3.partnerWarnB3);
    h+=calloutHtml(T3.partnerWarnH, ps(body));
  }
  /* 8 有限責任警示 */
  if(oc.lean==='company'||oc.lean==='both'||a.q3c==='company'||a.q3c==='unsure'){
    h+=calloutHtml(T3.ltdWarnH, ps([T3.ltdWarnB]));
  }
  return h+tailHtml();
}
function resultHtml(a,term){
  if(term.t===1) return resultType1(a,term.variant);
  if(term.t===2) return resultType2(a);
  return resultType3(a);
}

/* ============ 七、狀態與繪製 ============ */
var A = {};          /* 答案 */
var cursor = 'q1';   /* 目前所在：題號或 'result' */
var firstPaint = true;

var elTrack=document.getElementById('track');
var elDSteps=document.getElementById('dsteps');
var elMSteps=document.getElementById('msteps');
var elMStep=document.getElementById('mstep');
var elMBar=document.getElementById('mbar');
var elMFlow=document.getElementById('mflow');

function stepsHtml(){
  var R=reachable(A), n=0, out='';
  for(var i=0;i<STEPS.length;i++){
    var id=STEPS[i][0], name=STEPS[i][1], inR=!!R[id];
    if(inR) n++;
    var cls,mk,tail='',attrs='';
    if(!inR){ cls='s-skip'; mk=IC.dash; attrs=' disabled'; }
    else if(cursor===id){ cls='s-cur'; mk=String(n); attrs=' aria-current="step"'; }
    else if(A[id]!==undefined){ cls='s-done'; mk=IC.check; tail=IC.pencilS; attrs=' data-go="'+id+'"'; }
    else { cls='s-fut'; mk=String(n); attrs=' disabled'; }
    out+='<li><button type="button" class="step '+cls+'"'+attrs+'><span class="mk">'+mk+'</span><span class="nm">'+esc(name)+'</span>'+tail+'</button></li>';
  }
  if(cursor==='result') out+='<li><button type="button" class="step s-cur" aria-current="step"><span class="mk">'+IC.check+'</span><span class="nm">'+esc(LAST_STEP)+'</span></button></li>';
  else out+='<li><button type="button" class="step s-fut" disabled><span class="mk"></span><span class="nm">'+esc(LAST_STEP)+'</span></button></li>';
  return out;
}
function prevOf(){
  var w=walk(A);
  if(cursor==='result') return w.path.length?w.path[w.path.length-1]:null;
  var i=w.path.indexOf(cursor);
  if(i<0){ var o=ordered(A); i=o.indexOf(cursor); return i>0?o[i-1]:null; }
  return i>0?w.path[i-1]:null;
}
function render(keepView){
  var pg=progress(A,cursor);
  var html;
  if(cursor==='result'){
    var term=walk(A).terminal;
    html='<div class="rpage">'+resultHtml(A,term)+navHtml(!!prevOf())+footHtml()+'</div>';
    elTrack.className='track wide';
    elMStep.textContent=LAST_STEP;
  }else{
    var def=qdef(cursor,A);
    var body='';
    if(A[cursor]!==undefined) body+='<p class="editing">'+IC.pencil+'<span>正在修改已完成步驟</span></p>';
    body+='<p class="badge">'+esc(pg.text)+'</p>';
    body+='<h1 class="qh" tabindex="-1">'+esc(def.stem)+'</h1>';
    body+=explainHtml(def);
    if(def.official) body+=officialHtml();
    body+=choicesHtml(def,A[cursor]);
    if(def.ref) body+=refHtml();
    html=body+navHtml(!!prevOf())+footHtml();
    elTrack.className='track';
    elMStep.textContent=(function(){for(var i=0;i<STEPS.length;i++) if(STEPS[i][0]===cursor) return STEPS[i][1]; return '';})();
  }
  elTrack.innerHTML=html;
  /* 側欄與手機流程摘要為同一組步驟，只填入目前生效的容器，避免重複的地標與 aria-current */
  var s=stepsHtml();
  if(isDesk()){ elDSteps.innerHTML=s; elMSteps.innerHTML=''; }
  else { elMSteps.innerHTML=s; elDSteps.innerHTML=''; }
  elMBar.setAttribute('aria-valuenow',pg.pct);
  elMBar.setAttribute('aria-label',elMStep.textContent);
  elMBar.firstChild.style.width=pg.pct+'%';
  if(elMFlow.open){ elMFlow.open=false; }
  var sum=document.getElementById('mflowsum'); if(sum) sum.setAttribute('aria-expanded','false');
  if(!keepView){
    window.scrollTo(0,0);
    var h=elTrack.querySelector('.qh,.rh');
    if(h) h.focus();
  }
  firstPaint=false;
}
/* 桌機／手機切換時重繪（步驟容器與參考區預設展開狀態隨版型改變），不改動捲動與焦點 */
(function(){
  var mq=window.matchMedia('(min-width:1024px)');
  var h=function(){ render(true); };
  if(mq.addEventListener) mq.addEventListener('change',h);
  else if(mq.addListener) mq.addListener(h);
})();
function goto(id){ cursor=id; render(); }
function answer(qid,val){
  A[qid]=val;
  prune(A);
  var n=nextNode(qid,val);
  cursor=(typeof n==='string')?n:'result';
  render();
}

/* ============ 八、事件 ============ */
function syncAria(d,openState){
  var s=d&&d.querySelector?d.querySelector('summary'):null;
  if(s) s.setAttribute('aria-expanded', openState?'true':'false');
}
/* toggle 事件為權威來源（含程式改變 open） */
document.addEventListener('toggle',function(e){
  var d=e.target;
  if(!d || d.tagName!=='DETAILS') return;
  syncAria(d,d.open);
},true);
/* summary 被點擊或以鍵盤 Enter／Space 啟動時同步更新，不等 toggle 事件排程 */
document.addEventListener('click',function(e){
  var s=e.target.closest?e.target.closest('summary'):null;
  if(!s) return;
  var d=s.parentNode;
  if(d && d.tagName==='DETAILS') syncAria(d,!d.open);
},true);

elTrack.addEventListener('click',function(e){
  var c=e.target.closest ? e.target.closest('.choice') : null;
  if(c && cursor!=='result'){ answer(cursor,c.getAttribute('data-v')); return; }
  var b=e.target.closest ? e.target.closest('[data-act]') : null;
  if(!b) return;
  var act=b.getAttribute('data-act');
  if(act==='back'){ var p=prevOf(); if(p) goto(p); }
  else if(act==='restart'){ A={}; cursor='q1'; render(); }
});
function stepClick(e){
  var b=e.target.closest ? e.target.closest('[data-go]') : null;
  if(!b) return;
  goto(b.getAttribute('data-go'));
}
elDSteps.addEventListener('click',stepClick);
elMSteps.addEventListener('click',stepClick);

/* 供驗證程式使用（不影響一般使用） */
window.__tool={
  get answers(){return A;}, get cursor(){return cursor;},
  set:function(o){A={};for(var k in o)if(o.hasOwnProperty(k))A[k]=o[k];},
  answer:answer, goto:goto, render:render, reset:function(){A={};cursor='q1';render();},
  reachable:reachable, pathLengths:pathLengths, walk:walk, prune:prune, outcome:outcome,
  qdef:function(id){return qdef(id,A);}, STEPS:STEPS, OPTS:OPTS, nextNode:nextNode,
  progress:function(){return progress(A,cursor);}
};

render();
})();
</script>
</body>
</html>
