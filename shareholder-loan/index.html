<h1>股東往來風險自評</h1>
<hr class="rule">
<p class="lead">老闆或股東和公司之間的錢，例如股東先幫公司墊付費用、公司把錢借給股東，帳上常記在「股東往來」。這個工具可以幫你：</p>
<ol class="purpose">
<li>勾選你的公司遇到的情況，例如：公司把錢借給股東或負責人、老闆或股東的私人花費由公司付。</li>
<li>看每一種情況的風險高低：高風險、中風險或留意。</li>
<li>看為什麼會有這個風險，以及相關的依據。</li>
</ol>
