<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開公司決策工具｜聖彥學堂</title>
<style>

:root{
  --brand-navy-950:#061426;
  --brand-navy-900:#0A2646;
  --brand-navy-800:#123552;
  --brand-navy-700:#1F4668;
  --brand-gold-600:#C9954D;
  --brand-gold-500:#D2A663;
  --brand-gold-300:#DFC39A;
  --brand-gold-150:#EEE0CA;
  --paper-50:#FCFAF7;
  --paper-100:#F7F3EE;
  --paper-200:#F0E9E1;
  --paper-300:#E5D9CC;
  --ink-900:#10233C;
  --ink-800:#21344B;
  --ink-700:#455468;
  --ink-500:#6B7280;
  --danger-700:#A82920;
  --danger-100:#F9EAE7;
  --success-700:#2E6B4C;
  --success-100:#EAF4EE;
  --warning-700:#8A651E;
  --warning-100:#FBF1DD;
  --info-700:#294E70;
  --info-100:#EDF3F8;
  --shadow:0 12px 32px rgba(6,20,38,.08);
  --serif:"Noto Serif TC","Source Han Serif TC","PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper-50)}
body{font-family:var(--sans);color:var(--ink-900);background:var(--paper-50);line-height:1.75;font-size:16px;min-height:100vh}
button{font:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid var(--brand-gold-500);outline-offset:4px}
.app-shell{min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:58px 30px 28px;background:linear-gradient(160deg,var(--brand-navy-900),#0a3157 62%,#08223f);color:#fff;display:flex;flex-direction:column;overflow:auto}
.sidebar::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(circle at 25% 18%,rgba(255,255,255,.18),transparent 26%),linear-gradient(115deg,transparent 0 72%,rgba(210,166,99,.11) 72% 72.4%,transparent 72.4%)}
.brand-block,.sidebar-progress,.sidebar-bottom{position:relative;z-index:1}
.brand-title{font-family:var(--serif);font-size:38px;line-height:1.35;font-weight:700;letter-spacing:.04em;color:#fff}
.brand-type{margin-top:8px;color:var(--brand-gold-500);font-size:19px;letter-spacing:.08em}
.brand-rule{height:1px;background:linear-gradient(90deg,var(--brand-gold-500),var(--brand-gold-300),transparent);margin:28px 0 24px}
.progress-title{font-size:17px;letter-spacing:.04em;margin-bottom:13px;color:#f8f3eb}
.progress-list{list-style:none;position:relative;padding-left:6px}
.progress-list::before{content:"";position:absolute;left:18px;top:17px;bottom:17px;width:1px;background:rgba(255,255,255,.30)}
.progress-step{position:relative;min-height:48px;color:rgba(255,255,255,.76)}
.progress-action{position:relative;width:100%;display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:center;min-height:48px;border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer;border-radius:6px}
.progress-action:hover:not(:disabled){background:rgba(255,255,255,.055)}
.progress-action:focus-visible{outline:2px solid var(--brand-gold-500);outline-offset:2px}
.progress-action:disabled{cursor:not-allowed;color:inherit;opacity:1}
.progress-dot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.78);display:flex;align-items:center;justify-content:center;background:var(--brand-navy-900);font-size:14px;color:#fff;transition:.2s}
.progress-label{font-size:15px;line-height:1.35}
.progress-step.current{color:var(--brand-gold-500);font-weight:700}
.progress-step.current .progress-dot{background:var(--brand-gold-500);border-color:var(--brand-gold-500);color:var(--brand-navy-950);box-shadow:0 0 0 4px rgba(210,166,99,.10)}
.progress-step.done{color:#fff}
.progress-step.done .progress-dot{background:rgba(255,255,255,.12);border-color:var(--brand-gold-300);color:var(--brand-gold-300)}
.progress-step.future{opacity:.78}
.progress-step.result-step .progress-dot{font-size:12px}
.sidebar-bottom{margin-top:auto;padding-top:22px}
.side-disclaimer{border:1px solid rgba(223,195,154,.48);padding:14px 15px;border-radius:8px;font-size:13px;line-height:1.75;color:rgba(255,255,255,.86);background:rgba(255,255,255,.025)}
.side-disclaimer::before{content:"i";display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:var(--paper-50);color:var(--brand-navy-900);font-family:var(--serif);font-weight:700;margin-right:8px}
.side-signature{margin-top:22px;padding-top:18px;border-top:1px solid rgba(223,195,154,.56);font-size:14px;font-weight:700;letter-spacing:.03em;color:#f8f2e9}
.main-panel{min-width:0;background:radial-gradient(circle at 68% 2%,#fff 0,rgba(255,255,255,.76) 26%,transparent 52%),var(--paper-50)}
.content-wrap{max-width:1160px;margin:0 auto;padding:42px 54px 52px}
.mobile-header{display:none}
.question-page,.result-shell{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:.01;transform:translateY(5px)}to{opacity:1;transform:none}}
.question-meta-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;min-height:34px;margin-bottom:2px}
.edit-badge{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--warning-700);background:var(--warning-100);border:1px solid #ead7a8;border-radius:5px;padding:5px 9px}
.step-badge{display:inline-flex;align-items:center;min-height:36px;padding:7px 14px;border-radius:8px;background:var(--brand-navy-900);color:#fff;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.question-title{font-family:var(--serif);font-size:clamp(38px,4vw,58px);font-weight:700;line-height:1.3;letter-spacing:.015em;color:var(--brand-navy-900);max-width:1000px;margin:6px 0 0;text-wrap:balance}
.question-title:focus{outline:none}
.title-brush{width:112px;height:7px;margin:14px 0 26px;background:linear-gradient(90deg,var(--brand-gold-600),var(--brand-gold-300),transparent);clip-path:polygon(0 48%,86% 24%,100% 45%,84% 63%,0 78%)}
.question-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:28px;align-items:stretch}
.question-info.adaptive-single{grid-template-columns:1fr}
.question-info>*{min-width:0}
.question-info.single{grid-template-columns:1fr}
.core-card,.detail-card{background:rgba(252,250,247,.92);border:1px solid var(--brand-gold-150);border-radius:8px;box-shadow:0 5px 18px rgba(6,20,38,.035)}
.core-card{padding:30px 30px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:240px}
.core-icon{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--brand-navy-900);color:var(--brand-gold-500);margin-bottom:22px}
.core-icon svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.core-card h2{font-family:var(--serif);font-size:26px;color:var(--brand-navy-900);margin-bottom:18px;letter-spacing:.03em}
.core-copy{font-size:19px;line-height:1.8;color:var(--ink-900)}
.core-copy b.hl{display:inline;color:var(--danger-700);font-weight:700}
.detail-card{padding:26px 30px}
.detail-list{list-style:none;display:grid;gap:16px}
.detail-list>li{position:relative;padding-left:24px;font-size:16px;line-height:1.8;color:var(--ink-900)}
.detail-list>li::before{content:"";position:absolute;left:0;top:.8em;width:8px;height:8px;border-radius:50%;background:var(--brand-gold-500)}
b.hl{color:var(--danger-700);font-weight:700}
.detail-list p+p{margin-top:8px}
.detail-block{display:block}
.detail-block+.detail-block{margin-top:12px}
.inline-number-list{margin:12px 0 0 1.45em;display:grid;gap:8px}
.inline-number-list li{padding-left:4px}
.long-detail{border-top:1px solid var(--brand-gold-150);margin-top:16px;padding-top:12px}
.long-detail[open]{padding-bottom:2px}
.long-detail summary{min-height:44px;border-radius:6px;padding:8px 10px;margin:0 -10px;transition:background .16s ease,color .16s ease}
.long-detail summary:hover{background:var(--paper-100)}
.long-detail summary:focus-visible{outline:3px solid var(--brand-gold-500);outline-offset:2px}
.long-detail-body{border-left:2px solid var(--brand-gold-150);padding-left:16px;margin-top:4px}
.long-detail summary{cursor:pointer;color:var(--brand-navy-900);font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px}
.long-detail summary::-webkit-details-marker{display:none}
.long-detail summary::after{content:"＋";color:var(--brand-gold-600);font-size:20px}
.long-detail[open] summary::after{content:"－"}
.long-detail-body{padding-top:12px;display:grid;gap:12px;color:var(--ink-800)}
.choice-grid{display:grid;gap:18px;margin-top:2px}
.choice-grid.binary{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-grid.multi{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-grid.multi.count-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice-grid.multi.count-3.stack{grid-template-columns:1fr}
.choice-grid.multi.count-4{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-slot{position:relative;min-width:0}
.choice-slot.has-semantic-icon{padding-top:20px}
.choice{position:relative;width:100%;min-width:0;min-height:88px;height:auto;padding:18px clamp(50px,5vw,62px) 18px clamp(18px,2.4vw,26px);border:1.5px solid var(--brand-gold-600);background:var(--paper-50);color:var(--brand-navy-900);cursor:pointer;text-align:left;transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease;overflow-wrap:anywhere;word-break:normal}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand-gold-500)}
.choice:focus-visible{outline:3px solid var(--brand-gold-500);outline-offset:4px}
.choice.major{min-height:104px;height:auto;padding:clamp(19px,2.2vw,24px) clamp(58px,6vw,74px) clamp(19px,2.2vw,24px) clamp(34px,4vw,48px);clip-path:polygon(7% 0,93% 0,100% 30%,100% 70%,93% 100%,7% 100%,0 70%,0 30%);display:flex;align-items:center;justify-content:center;text-align:center;border:0;background:var(--brand-gold-500);color:var(--brand-navy-900);isolation:isolate}
.choice.major::before{content:"";position:absolute;z-index:-1;inset:2px;clip-path:inherit;background:var(--paper-50);transition:background .18s ease}
.choice.major:hover{background:var(--brand-gold-600)}
.choice.major.is-selected{color:#fff;box-shadow:0 8px 22px rgba(6,20,38,.12)}
.choice.major.is-selected::before{background:var(--brand-navy-900)}
.choice .choice-arrow{position:absolute;right:25px;top:50%;transform:translateY(-50%);font-family:var(--serif);font-size:34px;line-height:1;color:currentColor}
.choice .choice-index{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;margin-right:14px;background:var(--brand-navy-900);color:#fff;font-weight:700;flex:none;transition:background .18s ease,color .18s ease}
.choice.multi-choice{display:flex;align-items:center}
.choice-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:100%;gap:4px}
.choice.major .choice-copy{align-items:center;text-align:center;padding-inline:4px}
.choice-title{font-family:var(--serif);font-size:clamp(21px,2.2vw,27px);font-weight:700;line-height:1.45;letter-spacing:.02em;min-width:0;max-width:100%;overflow-wrap:anywhere}
.choice-meta{font-family:var(--sans);font-size:clamp(13px,1.05vw,15px);font-weight:500;line-height:1.55;letter-spacing:0;color:var(--ink-700);overflow-wrap:anywhere}
.multi-choice .choice-title{font-family:var(--sans);font-size:clamp(16px,1.35vw,18px);font-weight:700;letter-spacing:0}
.multi-choice .choice-meta{font-size:13px;color:var(--ink-700)}
.choice.is-selected{box-shadow:inset 4px 0 0 var(--brand-gold-500),0 8px 22px rgba(6,20,38,.08);border-color:var(--brand-navy-900)}
.choice.multi-choice.is-selected{background:var(--brand-navy-900);color:#fff;border-color:var(--brand-gold-500)}
.choice.multi-choice.is-selected .choice-index{background:var(--brand-gold-500);color:var(--brand-navy-950)}
.choice.is-selected .choice-title,.choice.is-selected .choice-meta{color:inherit}
.choice.is-selected .choice-state{display:inline-flex}
.choice-state{display:none;position:absolute;right:18px;bottom:8px;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--brand-gold-600);white-space:nowrap}
.choice.major .choice-state{right:26px;bottom:8px;color:var(--brand-gold-300);opacity:1}
.choice.multi-choice.is-selected .choice-state{color:var(--brand-gold-300)}
.choice-badge{position:absolute;z-index:5;top:0;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper-50);color:var(--brand-navy-900);border:1.5px solid var(--brand-gold-600);box-shadow:0 3px 10px rgba(6,20,38,.08);pointer-events:none}
.choice-badge svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.choice-slot.is-selected .choice-badge{background:var(--brand-gold-500);color:var(--brand-navy-950);border-color:var(--paper-50)}
.bottom-nav{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px;padding-top:20px;border-top:1px solid rgba(16,35,60,.2)}
.nav-action{min-height:44px;border:0;background:transparent;color:var(--brand-navy-900);font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px}
.nav-action:hover{color:var(--brand-gold-600)}
.nav-action:disabled{opacity:.34;cursor:not-allowed;color:var(--ink-500)}
.nav-icon{font-size:24px;line-height:1}
/* Result report */
.result-shell{padding-bottom:20px}
.result-hero{position:relative;padding:28px 34px 30px;margin:0 0 24px;border:1px solid var(--brand-gold-300);border-top:5px solid var(--brand-navy-900);border-radius:8px;background:linear-gradient(125deg,var(--paper-50),#fff);box-shadow:var(--shadow);overflow:hidden}
.result-hero::after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(201,149,77,.15);border-radius:50%;right:-95px;top:-120px;box-shadow:0 0 0 24px rgba(201,149,77,.04),0 0 0 52px rgba(201,149,77,.025)}
.res-head{position:relative;z-index:1;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--brand-gold-600);text-transform:uppercase;margin-bottom:8px}
.res-title{position:relative;z-index:1;font-family:var(--serif);font-size:clamp(38px,4.6vw,56px);font-weight:700;line-height:1.3;color:var(--brand-navy-900);margin-bottom:9px}
.res-note{position:relative;z-index:1;font-size:18px;color:var(--ink-700);max-width:780px;line-height:1.75}
.result-section{margin:18px 0;padding:22px 24px 23px;border:1px solid var(--brand-gold-150);border-radius:8px;background:rgba(255,255,255,.72);box-shadow:0 5px 18px rgba(6,20,38,.035)}
.result-section>h2{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:23px;line-height:1.45;color:var(--brand-navy-900);margin:0 0 15px}
.result-section>h2::before{content:"";width:28px;height:2px;background:var(--brand-gold-600);flex:none}
.result-section ul{padding-left:1.25em;display:grid;gap:8px;color:var(--ink-800)}
.result-section li{padding-left:3px}
.compare-card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--brand-gold-150);background:var(--brand-gold-150);overflow:hidden;border-radius:7px}
.compare-row{background:var(--paper-50);padding:15px 17px;font-size:15px;color:var(--ink-800)}
.warn,.info{position:relative;margin:14px 0;padding:16px 18px 16px 20px;border-radius:7px;border:1px solid var(--brand-gold-150);background:rgba(252,250,247,.92);color:var(--ink-800);line-height:1.75;box-shadow:0 3px 12px rgba(6,20,38,.025)}
.warn{border-left:4px solid var(--danger-700)}
.info{border-left:4px solid var(--info-700)}
.warn .wt,.info>strong{display:block;font-weight:700;font-size:16px;margin-bottom:7px;color:var(--brand-navy-900)}
.warn .wt::before{content:"!";display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:transparent;color:var(--danger-700);border:1px solid currentColor;margin-right:8px;font-size:13px}
.warn p,.info p{font-size:15px;margin-top:7px;color:var(--ink-800)}
.profession-points{margin:12px 0 0 1.45em;padding:0;display:grid;gap:10px;color:var(--ink-800)}
.profession-points li{padding-left:4px;font-size:15px;line-height:1.75}
.profession-points li::marker{font-weight:700;color:var(--brand-gold-600)}
.info>strong::before{content:"i";display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:transparent;color:var(--info-700);border:1px solid currentColor;margin-right:8px;font-family:var(--serif);font-size:13px}
.disc{margin:18px 0 0;padding:13px 15px;border-left:3px solid var(--brand-gold-500);background:var(--paper-100);color:var(--ink-700);font-size:13px}
.result-shell>.info:last-of-type{margin-top:20px}
.result-shell .bottom-nav{margin-top:24px}
/* Consultant Result Page v2 */
.result-hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,.65fr);column-gap:36px;align-items:end;padding:34px 38px 34px}
.result-hero::before{content:"CONSULTANT NOTE";position:relative;z-index:1;grid-column:2;grid-row:1 / span 3;align-self:center;justify-self:end;font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--brand-gold-600);writing-mode:vertical-rl;padding-left:18px;border-left:1px solid var(--brand-gold-150)}
.result-hero .res-head,.result-hero .res-title,.result-hero .res-note{grid-column:1}
.result-overview-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;margin:20px 0}
.result-overview-grid .result-section{margin:0;height:100%}
.result-compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}
.result-compare-grid .result-section{margin:0;height:100%}
.result-section{position:relative;padding-top:28px}
.result-section::after{content:attr(data-report-index);position:absolute;top:12px;right:16px;font-family:var(--serif);font-size:12px;letter-spacing:.12em;color:var(--brand-gold-600)}
.result-section.kind-status{border-top:3px solid var(--brand-navy-900);background:linear-gradient(145deg,#fff,var(--paper-50))}
.result-section.kind-reason{border-top:3px solid var(--brand-gold-500)}
.result-section.kind-profile{background:linear-gradient(160deg,var(--paper-50),#fff)}
.result-section.kind-next{border-left:3px solid var(--brand-gold-500)}
.result-section .warn,.result-section .info{box-shadow:none}
.result-section>.compare-card{margin-top:4px}
.result-shell .res-note{max-width:720px}
.result-report-label{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--brand-gold-600)}
.result-report-label::before{content:"";width:22px;height:1px;background:currentColor}
.result-limit-details{margin-top:18px;border-top:1px solid var(--brand-gold-150);padding-top:10px}
.result-limit-details summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:700;color:var(--brand-navy-900);list-style:none;padding:8px 4px}
.result-limit-details summary::-webkit-details-marker{display:none}
.result-limit-details summary::after{content:"＋";color:var(--brand-gold-600);font-size:20px}
.result-limit-details[open] summary::after{content:"－"}
.result-limit-body{padding:6px 0 2px}
/* Mobile */
@media(max-width:980px){
  .app-shell{display:block}.sidebar{display:none}.main-panel{min-height:100vh}.content-wrap{padding:24px 28px 44px;max-width:860px}
  .mobile-header{display:block;margin:-24px -28px 28px;padding:15px 20px 14px;background:var(--brand-navy-900);color:#fff;border-bottom:2px solid var(--brand-gold-500)}
  .mobile-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.mobile-tool{font-family:var(--serif);font-size:19px;font-weight:700}.mobile-step{font-size:13px;color:var(--brand-gold-300);white-space:nowrap}
  .mobile-progress{height:3px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}.mobile-progress-fill{height:100%;background:var(--brand-gold-500);transition:width .2s}

<script>
/* Design v0.9.5：執行業務者提醒改由銷售型態 q2 篩選 */

q1:{t:"你有沒有「固定營業場所」？",

o:[["yes","有"],["no","沒有"]]},

q2:{t:"你賣的主要是什麼？",
h:["先確認一件事：如果你是程式設計師、經紀人、表演人、著作人、工匠等執行業務者，且屬自力營生，你提供的專業性勞務依營業稅法第 3 條第 2 項但書不屬銷售勞務；若後續進入起徵點判斷，該專業性勞務不適用這個門檻。",
   "營業稅法施行細則第 6 條有完整的執行業務者列舉。是否屬於營業人，應回到你實際提供的內容判斷；若另有銷售貨物或其他勞務，可能另涉及營業稅，建議先向國稅局或事務所確認身分。"],

q3:{t:"你的月銷售額大約多少？",h:[],o:[]},

o:[["no","不是"],["yes","是"],["unsure","不確定"]]},

q4:{t:"你的事業獲利，比較接近下面哪一種情形？",
h:["這一題決定公司的保留盈餘優勢對你成不成立。",
   "<span class=detail-block>以下用一組典型假設做簡化試算：公司課稅所得已進入完整 20% 稅率，確有由當年度盈餘提列 10% 法定盈餘公積、公積尚未達實收資本額，且沒有其他未分配盈餘減項，並於法定期間內未分配。</span><span class=detail-block>在這組假設中，先繳 20% 營所稅，稅後剩 80%，提列 10% 法定盈餘公積後剩 72%（80% 減去 80%×10%），若不分配再加徵 5%，<b class=hl>總稅負約 23.6%</b>（20% 加 72%×5%）。</span>",
   "行號則要看這筆獲利<b class=hl>實際多繳了多少稅</b>，也就是把獲利併進去之後的綜所稅，減掉併進去之前的綜所稅，再除以獲利。這個數字會比你最後落在的級距低，因為前面幾段仍用低稅率計算。",
   "如果事業是你主要收入，獲利從免稅額開始往上疊，這個數字要到獲利約 636 萬元才會超過 23.6%（以 115 年度免稅額 10.1 萬、標準扣除額 13.6 萬、單身無扶養試算；若有配偶或扶養親屬，門檻會更高），所以<b class=hl>多數情況行號較省</b>。",
   "如果獲利是疊在既有的高所得之上，前面的低稅率段已被其他所得用掉，這個數字會接近你的邊際稅率，公司才可能有優勢。",
   "精確答案要用你的實際數字試算，這一題只做方向判斷。"],
o:[["low","事業是我主要的收入來源，其他所得不多"],
   ["high","我或配偶另有相當的薪資或其他所得，事業獲利是額外加上去的"],
   ["unsure","不確定"]]},

q5:{t:"未來一到兩年，有沒有向銀行貸款或參與政府標案的打算？",
h:["這一題不影響計分，只作為後續規劃提醒，請照實回答。"],
o:[["yes","有"],["no","沒有"],["unsure","不確定"]]},

q6:{t:"你會不會有合夥人一起出資？",
h:["這一題不影響計分，但會影響你要注意的風險，請照實回答。"],
o:[["solo","只有我自己"],["partner","會有合夥人"]]},

q7:{t:"你在意責任風險嗎？也就是萬一事業出狀況，是否希望個人財產與事業債務分開？",
h:["這一題與你有沒有合夥人無關，一個人經營一樣要面對。",
   "獨資行號負<b class=hl>無限清償責任</b>，行號還不出的債務會直接動用你的個人財產。有限公司的股東則以出資額為限，公司資產不足時，債權人原則上追不到你的個人財產。",
   "但有限責任不是密不透風，下列四件事要分開理解：<ol class=\"inline-number-list\"><li><b class=hl>股東有限責任</b>，這是原則。</li><li><b class=hl>負責人自己的法定責任</b>，依公司法第 23 條第 2 項，負責人對於公司業務之執行違反法令致他人受有損害時，應與公司負連帶賠償之責。</li><li><b class=hl>股東濫用法人地位</b>，依公司法第 99 條第 2 項，致公司負擔特定債務且清償顯有困難、情節重大者，該股東應負清償之責。</li><li><b class=hl>你自己簽下的連帶保證</b>。</li></ol>",
   "第二項的要件是違反法令致他人受損害，不是一般的經營失誤。第四項屬授信實務，那是契約義務，不是公司法的法定破口。"],
o:[["care","很在意"],["ok","還好，先求簡單"]]}
};

var FIRM={t:"設立行號",rows:["責任：無限清償，個人財產要賠","稅負：免營所稅，強制併入綜所稅","融資：貸款、投標相對不利","適合：小本經營、工作室型態"]};
var CORP={t:"設立公司",rows:["責任：有限公司股東以出資額為限","稅負：營所稅 20%，盈餘可分配或保留","融資：貸款、投標較有利","適合：規模化發展、需要融資"]};

function reachesReg(){return A.q1==="yes"||(A.q1==="no"&&A.q3==="reached");}
function isExempt(){return A.q1==="no"&&A.q3==="below";}

function steps(){
  var s=["q1"];
  if(A.q1!==undefined)s.push("q2");
  if(A.q1==="no"&&A.q2)s.push("q3");
  if(reachesReg())s.push("q3b","q4","q5","q6","q7");
  return s;
}
function nextQ(){
  var s=steps();
  for(var i=0;i<s.length;i++){if(A[s[i]]===undefined)return {id:s[i],n:i+1};}
  return null;
}
function answered(){var s=steps(),r=[];for(var i=0;i<s.length;i++){if(A[s[i]]!==undefined)r.push(s[i]);}return r;}

function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function clearKeys(keys){for(var i=0;i<keys.length;i++)delete A[keys[i]];}
function invalidateAfterEdit(id,oldVal,newVal){
  if(oldVal===newVal)return;
  if(id==="q1")clearKeys(["q2","q3","q3b","q4","q5","q6","q7"]);
  else if(id==="q2")clearKeys(["q3","q3b","q4","q5","q6","q7"]);
  else if(id==="q3")clearKeys(["q3b","q4","q5","q6","q7"]);
}
function pick(id,v){
  var old=A[id],editing=EDIT_CONTEXT&&EDIT_CONTEXT.target===id;
  if(editing){
    if(old!==v){invalidateAfterEdit(id,old,v);A[id]=v;}
    EDIT_CONTEXT=null;render();return;
  }
  A[id]=v;render();
}
function back(){
  if(EDIT_CONTEXT){
    var ids=progressPlan().ids,idx=ids.indexOf(EDIT_CONTEXT.target);
    if(idx>0){EDIT_CONTEXT.target=ids[idx-1];render();}
    return;
  }
  var a=answered();if(a.length){delete A[a[a.length-1]];}render();
}
function restart(){A={};EDIT_CONTEXT=null;render();}
function jumpToStep(id){
  var plan=progressPlan(),idx=plan.ids.indexOf(id);
  if(idx<0)return;
  if(A[id]===undefined){var t=document.querySelector('.question-title');if(t)t.focus();return;}
  EDIT_CONTEXT={target:id};render();
}

function panel(o){
  var h='<div class="compare-card">';
  for(var i=0;i<o.rows.length;i++)h+='<div class="compare-row">'+esc(o.rows[i])+'</div>';
  return h+'</div>';
}

function kindText(){
  if(A.q2==="goods")return "銷售貨物（門檻為月銷售額 10 萬元）";
  if(A.q2==="service")return "銷售勞務（門檻為月銷售額 5 萬元）";
  return "同時銷售貨物與勞務（依百分比合計數判斷）";
}
function bothWarn(){
  return '<div class="warn"><div class="wt">你兼營貨物與勞務，門檻要合併計算</div>'+
  '<p>起徵點不是各自單獨計算。依財政部「小規模營業人營業稅起徵點」規定，應以各業別銷售額占各該起徵點之百分比合計數判斷，<b>合計達 100% 即應課徵</b>。</p>'+
  '<p>舉例：本月貨物 6 萬元、勞務 3 萬元，6/10 加 3/5 等於 12/10，合計達百分之百，即已達起徵點。若你剛才是分別看兩個數字而判定未達，請重新以合計方式確認一次。</p></div>';
}
function scopeNote(){
  return '<div class="warn"><div class="wt">暫免不是永久，每個月都要重新確認</div>'+
  '<p>你沒有對外經營的固定營業場所，月銷售額也未達起徵點，兩個條件都成立，因此現階段可以暫時不辦稅籍登記。<b>這與你是透過網路、熟客介紹或其他方式承接無關。</b></p>'+
  '<p>但這是每個月重新認定的狀態，不是一個確定下來就不會變的身分。<b class=hl>只要有一個月跨過門檻，當月就要辦理</b>，不能等到下個月或年底。</p>'+
  '<p>依據上有一點差別：透過網路銷售者，財政部 109 年 1 月 31 日台財稅字第 10904512340 號令明定未達起徵點得暫免、達到起徵點應即辦理，且當月未辦而在次月月底前補辦者，<b class=hl>免依營業稅法第 45 條及第 51 條第 1 項第 1 款處罰</b>，只需補繳營業稅。其他通路沒有這則專屬函令，登記義務依營業稅法第 28 條掛在固定營業場所上，你既然沒有場所，登記的觸發點本來就不成立；但也因此沒有那個明文的補辦免罰窗口，逾期須視個案判斷，稅捐稽徵法第 48 條之 1 另有自動補報補繳免罰的空間。</p></div>'+
  '<div class="info">起徵點原則上是用來判斷需不需要繳納營業稅。有固定營業場所者不論金額大小都應辦理稅籍登記，只是未達起徵點者由稽徵機關查定為免徵。但對沒有固定營業場所的人而言，起徵點同時也是登記義務的開關，這一點與前者不同。</div>';
}
function licenseWarn(){
  if(A.q3b==="no")return "";
  var t=A.q3b==="yes"?"你的營業項目屬於特許或許可業務":"你不確定營業項目是否屬於特許或許可業務";
  return '<div class="warn"><div class="wt">'+t+'，下面的建議可能不適用</div>'+
  '<p>部分特許或許可業務，依法令要求<b class=hl>必須以公司組織經營</b>，或須先取得目的事業主管機關許可才能辦理工商登記。若你的項目屬於此類，<b class=hl>本工具建議設立行號的結論將不成立。</b></p>'+
  '<p>請先向目的事業主管機關或委託事務所確認你的營業項目可否以行號經營，再回頭參考下面的建議。</p></div>';
}
function professionWarn(){
  if(A.q2!=="service"&&A.q2!=="both")return "";
  return '<div class="info"><strong>補充：你可能屬於執行業務者，請先確認身分</strong>'+
  '<p style="margin-top:6px">執行業務者提供其專業性勞務不屬於營業稅的銷售勞務範圍，因此<b class=hl>不論有沒有固定營業場所</b>，如果你只有提供這類專業性勞務、沒有銷售貨物或其他勞務，就沒有辦理營業稅稅籍登記的問題。請先確認自己的身分，再看下面的結論。</p>'+
  '<p style="margin-top:6px">課程提到美甲、設計、寫程式、賺取佣金、主持等，大部分會歸類為銷售勞務，這是常見情形。但其中有三項<b class=hl>值得你進一步確認</b>。</p>'+
  '<ol class="profession-points">'+

  for(var i=0;i<opts.length;i++){
    var val=opts[i][0],rawLabel=String(opts[i][1]),parts=splitChoiceLabel(rawLabel),selected=A[qid]===val,sel=selected?' is-selected':'';
    var title=esc(parts.title),meta=parts.meta?'<span class="choice-meta">'+esc(parts.meta)+'</span>':'',aria=esc(rawLabel);
    var copy='<span class="choice-copy"><span class="choice-title">'+title+'</span>'+meta+'</span>';
    if(binary){
      var icon=semanticChoiceIcon(qid,val),hasIcon=icon?' has-semantic-icon':'',slotSel=selected?' is-selected':'';
      h+='<div class="choice-slot'+hasIcon+slotSel+'">';
      if(icon)h+='<span class="choice-badge" aria-hidden="true">'+icon+'</span>';
      h+='<button type="button" class="choice major'+sel+'" aria-label="'+aria+'" aria-pressed="'+(selected?'true':'false')+'" onclick="pick(\''+qid+'\',\''+val+'\')">'+copy+'<span class="choice-arrow" aria-hidden="true">→</span><span class="choice-state">✓ 已選</span></button></div>';
    }else{
      h+='<button type="button" class="choice multi-choice'+sel+'" aria-label="'+aria+'" aria-pressed="'+(selected?'true':'false')+'" onclick="pick(\''+qid+'\',\''+val+'\')"><span class="choice-index" aria-hidden="true">'+(i+1)+'</span>'+copy+'<span class="choice-arrow" aria-hidden="true">→</span><span class="choice-state">✓ 已選</span></button>';
    }
  }
  return h+'</div>';
}
function enhanceResult(){
  var root=document.querySelector('.result-shell'); if(!root)return;
  var rh=root.querySelector(':scope > .res-head'),rt=root.querySelector(':scope > .res-title'),rn=root.querySelector(':scope > .res-note');
  if(rh&&rt&&rn){
    var hero=document.createElement('header');hero.className='result-hero';root.insertBefore(hero,rh);
    var lab=document.createElement('div');lab.className='result-report-label';lab.textContent='專業判斷摘要';hero.appendChild(lab);
    hero.appendChild(rh);hero.appendChild(rt);hero.appendChild(rn);
  }
  var heads=Array.prototype.slice.call(root.querySelectorAll(':scope > h2')),index=1;
  heads.forEach(function(hd){
    if(!hd.parentNode||hd.parentNode!==root)return;
    var sec=document.createElement('section'),txt=hd.textContent.trim();
    sec.className='result-section';sec.dataset.reportIndex=String(index++).padStart(2,'0');
    if(txt.indexOf('先確認')===0)sec.classList.add('kind-status');
    else if(txt==='判斷理由')sec.classList.add('kind-reason');
    else if(txt.indexOf('設立行號')===0||txt.indexOf('設立公司')===0)sec.classList.add('kind-profile');
    else if(txt.indexOf('選擇')===0||txt.indexOf('仍須留意')===0)sec.classList.add('kind-next');
    root.insertBefore(sec,hd);sec.appendChild(hd);
    var n=sec.nextSibling;
    while(n&&!(n.nodeType===1&&n.tagName==='H2')&&!(n.nodeType===1&&n.classList.contains('bottom-nav'))){var next=n.nextSibling;sec.appendChild(n);n=next;}
  });
  var status=root.querySelector('.result-section.kind-status'),reason=root.querySelector('.result-section.kind-reason');
  if(status&&reason&&status.parentNode===root&&reason.parentNode===root){
    var over=document.createElement('div');over.className='result-overview-grid';root.insertBefore(over,status);over.appendChild(status);over.appendChild(reason);
  }
  var profiles=Array.prototype.slice.call(root.querySelectorAll(':scope > .result-section.kind-profile'));
  if(profiles.length===2){
    var pair=document.createElement('div');pair.className='result-compare-grid';root.insertBefore(pair,profiles[0]);pair.appendChild(profiles[0]);pair.appendChild(profiles[1]);
  }
  /* 將最次要的通用限制收合，不刪除內容 */
  var secs=root.querySelectorAll('.result-section');
  for(var i=0;i<secs.length;i++){
    var disc=secs[i].querySelector(':scope > .disc');
    if(disc){
      var detail=document.createElement('details');detail.className='result-limit-details';
      var summary=document.createElement('summary');summary.textContent='使用限制與課程補充';summary.setAttribute('aria-expanded','false');
      var body=document.createElement('div');body.className='result-limit-body';
      disc.parentNode.insertBefore(detail,disc);detail.appendChild(summary);detail.appendChild(body);
      var prev=detail.previousElementSibling;
      if(prev&&prev.classList&&prev.classList.contains('info'))body.appendChild(prev);
      body.appendChild(disc);
    }
  }
}
function focusPrimaryHeading(){
  var t=document.querySelector('.question-title,.res-title');if(t){t.setAttribute('tabindex','-1');try{t.focus({preventScroll:true});}catch(e){t.focus();}}
}
function syncDisclosureA11y(){
  var ds=document.querySelectorAll('details.long-detail,details.result-limit-details');
  for(var i=0;i<ds.length;i++){
    (function(d){var sm=d.querySelector('summary');if(!sm)return;
      sm.setAttribute('aria-expanded',d.open?'true':'false');
      d.addEventListener('toggle',function(){sm.setAttribute('aria-expanded',d.open?'true':'false');});
    })(ds[i]);
  }
}

function getQuestionView(qid){
  var q=Q[qid],opts=q.o,help=q.h;
  if(qid==="q3"){
    if(A.q2==="goods"){help=["你選擇的是銷售貨物，適用的門檻為月銷售額 10 萬元。"];opts=[["reached","已達門檻（月銷售額達 10 萬元）"],["below","未達門檻（月銷售額未達 10 萬元）"]];}
    else if(A.q2==="service"){help=["你選擇的是銷售勞務，適用的門檻為月銷售額 5 萬元。"];opts=[["reached","已達門檻（月銷售額達 5 萬元）"],["below","未達門檻（月銷售額未達 5 萬元）"]];}
    else{help=["你同時銷售貨物與勞務，起徵點不是各自單獨計算。","計算方式：貨物銷售額除以 10 萬，加上勞務銷售額除以 5 萬，兩者的百分比合計達 100% 即為已達門檻。","舉例：本月貨物 6 萬元、勞務 3 萬元，6/10 加 3/5 等於 12/10，合計達百分之百，即已達起徵點。"];opts=[["reached","已達門檻（百分比合計達 100%）"],["below","未達門檻（百分比合計未達 100%）"]];}
  }
  return {q:q,opts:opts,help:help};
}

function render(){
  var el=document.getElementById("app");

  if(!EDIT_CONTEXT&&isExempt()){
    updateChrome(null,true);
    el.innerHTML='<div class="result-shell">'+exemptResult()+'</div>';
    enhanceResult();syncDisclosureA11y();focusPrimaryHeading();window.scrollTo(0,0);return;
  }

  var nq=nextQ(),qid=null;
  if(EDIT_CONTEXT&&A[EDIT_CONTEXT.target]!==undefined){qid=EDIT_CONTEXT.target;}
  else if(nq){qid=nq.id;}

  if(!qid&&nq===null){
    updateChrome(null,true);
    el.innerHTML='<div class="result-shell">'+identityResult()+'</div>';
    enhanceResult();syncDisclosureA11y();focusPrimaryHeading();window.scrollTo(0,0);return;
  }

  var view=getQuestionView(qid),q=view.q,opts=view.opts,help=view.help;
  var m=updateChrome(qid,false);
  var badge='第 '+m.current+' 步'+(m.exact?'，共 '+m.total+' 步':'，最多 '+m.total+' 步');
  var editNote=EDIT_CONTEXT?'<span class="edit-badge">正在修改已完成步驟</span>':'';
  var h='<article class="question-page" data-question="'+qid+'"><div class="question-meta-row">'+editNote+'<span class="step-badge">'+badge+'</span></div>'+
    '<h1 class="question-title">'+esc(q.t)+'</h1><div class="title-brush" aria-hidden="true"></div>'+
    helpMarkup(qid,help)+choiceMarkup(qid,opts)+navBar()+'</article>';
  el.innerHTML=h;
  syncDisclosureA11y();focusPrimaryHeading();window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
